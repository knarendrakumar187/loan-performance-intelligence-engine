version: '3.8'

services:
  # Streamlit Web Dashboard
  web-dashboard:
    build: .
    container_name: lpie-dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    command: streamlit run app.py --server.port=8501 --server.address=0.0.0.0 --server.headless=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FastAPI REST API Microservice
  api-service:
    build: .
    container_name: lpie-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: uvicorn src.api.server:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
